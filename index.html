<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Compo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap");
      /* font-['Inter'] */

      @import url("https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap");
      /* font-['Lexend_Deca'] */
      :root {
        --Navy-950: hsl(233, 47%, 7%);
        --Blue-950: hsl(244, 37%, 16%);
        --Purple-500: hsl(277, 64%, 61%);
        --White: hsl(0, 0%, 100%);
        --White-2: hsla(0, 0%, 100%, 0.75;);
        --White-3: hsla(0, 0%, 100%, 0.6);
      }
    </style>
  </head>
  <!-- =============================== -->
  <body class="max-w-[375px] m-auto bg-[var(--Navy-950)] lg:max-w-[1440px]">
    <div
      class="text-[var(--White)] flex flex-col gap-6 items-center bg-[var(--Blue-950)] my-14 rounded-b-[10px] rounded-t-[10px] mx-3 lg:flex-row lg:w-fit lg:m-auto lg:mt-[40px]"
    >
      <!-- Mobile -->
      <div class="relative isolate overflow-hidden rounded-t-[10px] lg:hidden">
        <img
          class="w-full grayscale"
          src="/images/image-header-mobile.jpg"
          alt=""
        />
        <div
          class="absolute inset-0 bg-[var(--Purple-500)] mix-blend-multiply"
        ></div>
      </div>

      <!-- Desktop -->
      <div
        class="relative isolate order-2 hidden overflow-hidden lg:block lg:rounded-tr-[10px] lg:rounded-br-[10px] w-[450px]"
      >
        <img
          class="size-full object-cover grayscale"
          src="/images/image-header-desktop.jpg"
          alt=""
        />
        <div
          class="absolute inset-0 bg-[var(--Purple-500)] mix-blend-multiply"
        ></div>
      </div>
      <div class="flex-col flex gap-15">
        <div class="flex flex-col gap-4 lg:gap-7">
          <h1
            class="text-center text-3xl font-['Inter'] font-bold px-10 mt-7 lg:text-start lg:leading-[1.1] lg:w-[400px] lg:text-[30px]"
          >
            Get <span class="text-[var(--Purple-500)]">insights</span> that help
            your business grow.
          </h1>
          <p
            class="text-center text-[var(--White-3)] font-['Inter'] px-10 lg:text-start lg:text-[12px] lg:w-[370px]"
          >
            Discover the benefits of data analytics and make better decisions
            regarding revenue, customer experience, and overall efficiency.
          </p>
        </div>

        <div
          class="flex flex-col gap-5 items-center mb-13 font-['Lexend_Deca'] lg:flex-row lg:pl-10 lg:gap-12"
        >
          <div class="text-center">
            <p class="text-[20px]">10k+</p>
            <p class="text-[10px] text-[var(--White-3)]">COMPANIES</p>
          </div>
          <div class="text-center">
            <p class="text-[20px]">314</p>
            <p class="text-[10px] text-[var(--White-3)]">TEMPLATES</p>
          </div>
          <div class="text-center">
            <p class="text-[20px]">12M+</p>
            <p class="text-[10px] text-[var(--White-3)]">QUERIES</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
